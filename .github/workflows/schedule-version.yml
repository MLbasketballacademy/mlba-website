# Fails when fall-league-schedule.html's schedule changed but its version was not updated, so an open page
# would never learn about the change. Fix: run `node scripts/schedule-version.mjs` and commit the result.
name: schedule-version
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/schedule-version.mjs --check
